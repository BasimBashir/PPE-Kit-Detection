# Demo cameras: RTSP via toxiproxy (185NN) -> MediaMTX. Credentials come from RTSP_READ_USER/RTSP_READ_PASS.
# Seeded into the database on first start; edit through the API/UI afterwards.
cameras:
- id: cam01
  name: Site A - rebar deck
  stream_uri: rtsp://localhost:18501/cam01
  credential_ref: env:RTSP_READ
  transport: tcp
  enabled: true
  site: Demo (simulated RTSP)
  location: rebar deck
