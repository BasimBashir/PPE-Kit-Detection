# Application tunables (schema: backend/app/config/settings.py AppConfig). Copy to app.yaml to override.
mode: demo            # demo => dashboard shows "SIMULATED SOURCES"; live => real cameras only

demo:                 # ignored in live mode
  autostart_simulator: true      # API starts scripts/demo/rtsp_simulator.py if it is not running
  simulator_url: http://127.0.0.1:8890
  initial_streams: 10            # 1-10 simulated cameras; change at runtime on the "Demo control" page

pipeline:
  target_fps: 5       # processed FPS per camera (benchmarks also run 2 and 10)
  max_batch: 10
  max_batch_wait_ms: 0
  preview_fps: 4
  preview_width: 640
  preview_jpeg_quality: 70
  convert_fps_factor: 2.0

ingest:
  transport: tcp
  open_timeout_s: 5
  read_timeout_s: 5
  stall_timeout_s: 5
  degraded_frame_age_s: 1.5
  degraded_fps_ratio: 0.5
  backoff_base_s: 1
  backoff_max_s: 10
  stable_reset_s: 10
  hwaccel: none       # cuda = NVDEC hardware decode (falls back to software); frees the CPU for 4K streams
                      # (~10 4K@25fps streams per RTX 3090; docs/benchmarks/phase3-4k.md)

tracking:
  tracker: bytetrack
  track_activation_threshold: 0.35
  lost_track_buffer_s: 2.0
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 1
  track_expiry_s: 3.0

association:
  head_roi: keypoints
  roi_top_frac: 0.25
  roi_side_margin_frac: 0.15
  roi_up_frac: 0.06
  keypoint_min_conf: 0.5
  min_head_keypoints: 2
  min_ioa: 0.5
  max_center_dist: 0.6
  helmet_width_ratio: [0.12, 0.9]
  conflict_margin: 0.15
  use_classifier: true

alerts:
  cooldown_s: 60
  spatial_dedupe_s: 30
  spatial_dedupe_iou: 0.3
  spatial_dedupe_head_dist: 0.75
  last_seen_update_s: 5
  outbox_max_attempts: 8
  outbox_backoff_base_s: 0.5
  outbox_backoff_max_s: 60
  local_sound_enabled: false

evidence:
  retention_days: 30
  min_free_bytes: 1000000000
  jpeg_quality: 85
  retention_check_interval_s: 3600

teacher:              # asynchronous review of head crops by an external decision model; never on the alert path
  enabled: false      # off by default: no crops leave the site, zero behaviour change
  provider: gemini    # gemini | systemone | fake ; gemini reads GEMINI_API_KEY from .env
  model: gemini-decision-1
  base_url: https://generativelanguage.googleapis.com/v1beta   # systemone: http://<host>:<port>
  weight: 0.5                    # fused = weight * p_teacher + (1 - weight) * p_model   (p = P(no helmet))
  escalate_threshold: 0.8        # compliant sample with fused above => new event "raised by teacher review"
  false_alert_threshold: 0.2     # alert with fused below => tagged LIKELY_FALSE_ALERT (never suppressed)
  compliant_sample_rate: 0.05    # share of tracks turning COMPLIANT that are reviewed
  max_reviews_per_minute: 30
  timeout_s: 30       # live gemini-decision-1 p95 is ~8 s
