global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: ["/etc/prometheus/alert-rules.yml"]

scrape_configs:
  # FastAPI process (API, outbox dispatcher, worker supervisor).
  - job_name: ppe-api
    static_configs: [{targets: ["host.docker.internal:8000"]}]
  # Pipeline worker process (ingest, inference, tracking, events).
  - job_name: ppe-worker
    static_configs: [{targets: ["host.docker.internal:9101"]}]
