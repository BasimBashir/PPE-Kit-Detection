[project]
name = "ppe-intelligence"
version = "0.1.0"
description = "Offline-first multi-camera PPE (hard hat) monitoring - portfolio demonstration"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]>=0.35",
    "pydantic-settings>=2.10",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "av==19.0.2",
    "numpy>=2.1",
    "ultralytics==8.4.198",
    "torch==2.14.1",
    "torchvision",
    "prometheus-client==0.26.0",
    "psutil>=7.0",
    "nvidia-ml-py==13.615.71",
    "pyyaml>=6.0",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-timeout>=2.4",
    "httpx>=0.28",
    "ruff>=0.13",
    "mypy>=1.18",
    "types-PyYAML",
    "types-psutil",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"app/observability/metrics.py" = ["E501"]
"app/api/**" = ["B008"]
"**/scripts/**" = ["S603", "S607", "S310"]  # ops scripts: fixed args to ffmpeg/docker, localhost URLs

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
    "integration: needs PostgreSQL / MediaMTX running (docker compose up)",
    "gpu: needs CUDA GPU and model weights",
    "slow: long-running performance tests",
]
